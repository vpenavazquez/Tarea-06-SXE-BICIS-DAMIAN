services:
  # 1. Servidor de Base de Datos
  db:
    image: mariadb:10.11
    container_name: bicis_damian_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Aplicación ERP/CRM Dolibarr
  web:
    image: tuxgasy/dolibarr:20.0.0
    container_name: bicis_damian_app
    restart: always
    ports:
      - "${PORT_APP}:80"
    environment:
      DOLI_DB_HOST: db
      DOLI_DB_NAME: ${MYSQL_DATABASE}
      DOLI_DB_USER: ${MYSQL_USER}
      DOLI_DB_PASSWORD: ${MYSQL_PASSWORD}
      DOLI_ADMIN_LOGIN: ${DOLI_ADMIN_LOGIN}
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dolibarr_html:/var/www/html
      - dolibarr_docs:/var/www/documents

  # 3. Gestor de Base de Datos
  adminer:
    image: adminer:4.8.1
    container_name: bicis_damian_adminer
    restart: always
    ports:
      - "${PORT_ADMINER}:8080"
    depends_on:
      - db

volumes:
  db_data:
  dolibarr_html:
  dolibarr_docs:
